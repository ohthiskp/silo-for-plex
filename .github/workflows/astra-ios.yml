name: Astra iOS (TestFlight)
run-name: TestFlight ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-ios
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.1"
  BUNDLE_ID: com.ohthiskp.astra

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check Apple secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "All Apple secrets are present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Python tools
        run: python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography

      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          # Rebuild a clean PEM from however the key was pasted (TextEdit smart dashes,
          # joined lines, Windows line ends, missing BEGIN/END lines, stray spaces).
          python3 - "$RUNNER_TEMP/asc/AuthKey.p8" <<'PY'
          import base64, os, re, sys
          raw = os.environ["ASC_KEY_P8"]
          raw = raw.replace("\u2013", "-").replace("\u2014", "-").replace("\u2212", "-").replace("\r", "")
          body = re.sub(r"-+\s*(BEGIN|END)[A-Z ]*PRIVATE KEY\s*-+", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          try:
              der = base64.b64decode(body, validate=True)
          except Exception:
              print("::error::ASC_KEY_P8 doesn't look like an App Store Connect .p8 key. Re-paste the whole file contents.")
              sys.exit(1)
          if len(der) < 100:
              print(f"::error::ASC_KEY_P8 looks cut off ({len(der)} bytes decoded). Re-paste the whole .p8 file contents.")
              sys.exit(1)
          lines = [body[i:i + 64] for i in range(0, len(body), 64)]
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END PRIVATE KEY-----\n"
          try:
              from cryptography.hazmat.primitives import serialization as ser
              key = ser.load_pem_private_key(pem.encode(), None)
              pem = key.private_bytes(ser.Encoding.PEM, ser.PrivateFormat.PKCS8, ser.NoEncryption()).decode()
          except Exception as e:
              print(f"::warning::Couldn't normalise the key ({type(e).__name__}); using it as pasted.")
          open(sys.argv[1], "w").write(pem)
          print(f"API key rebuilt ({len(der)} bytes).")
          PY
          chmod 600 "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"
          # IDs without stray spaces, for xcodebuild (they are identifiers, not secrets)
          echo "KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]' | tr 'A-F' 'a-f')" >> "$GITHUB_ENV"
          echo "TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Register app ID and check the App Store Connect listing
        id: asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PLATFORM: IOS
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 tool/astra/asc_preflight.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Pub and CocoaPods
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.pub-cache
            ios/Pods
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: astra-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile.lock') }}

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Read version
        id: ver
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"
          echo "build=$(( 1000 + ${{ github.run_number }} ))" >> "$GITHUB_OUTPUT"

      - name: Build Flutter app
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: >
          flutter build ios --release --no-codesign
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.build }}
          --dart-define=SUPPORTER_MODE=unlocked
          --dart-define=TMDB_TOKEN="$TMDB_TOKEN"
          --dart-define=GIT_COMMIT=${{ github.sha }}

      - name: Archive (signed with your team)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Astra.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*sign|ARCHIVE (SUCCEEDED|FAILED)" || true
          test -d "$RUNNER_TEMP/Astra.xcarchive" || { tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><false/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><true/>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Astra.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "### Uploaded Astra ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.build }}) to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple processes it for 5–30 minutes, then it appears in the TestFlight app." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
