name: Astra TMDB trending probe
run-name: TMDB trending probe

# Prints TMDB's trending lists (titles only), to compare with a reference site.
on:
  push:
    branches: [claude/project-thread-otuzui]
    paths: [".github/workflows/astra-tmdb-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Trending lists
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          for path in "movie/popular?region=US" "tv/popular?page=1" "movie/now_playing?region=US" "discover/movie?sort_by=popularity.desc&watch_region=US&with_watch_monetization_types=flatrate|rent|buy" "discover/tv?sort_by=popularity.desc&watch_region=US&with_watch_monetization_types=flatrate&with_original_language=en"; do
            echo "=== $path"
            curl -sS -H "Authorization: Bearer $TMDB_TOKEN" "https://api.themoviedb.org/3/$path&language=en-US" \
              | python3 -c 'import json,sys; [print(i+1, x.get("media_type"), x.get("title") or x.get("name")) for i,x in enumerate(json.load(sys.stdin).get("results",[])[:15])]'
          done
